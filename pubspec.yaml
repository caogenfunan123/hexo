name: hexo
description: Hexo 博客写作与发布管理系统 - 全平台 (Android / iOS / Web / 桌面)
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.0.0
  flutter_markdown: ^0.6.12
  webview_flutter: ^4.4.0
  file_picker: ^10.0.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  # 本地 GGUF 模型推理（llamadart：llama.cpp 绑定，Android 支持 CPU+Vulkan 双后端，
  # 构建期 hook 自动下载预编译 native 运行时，逐 token 真流式）。
  # 0.8.19 升级 llama.cpp native 到 b10333，修复 Android 加载期崩溃回归。
  llamadart: ^0.8.19
  markdown: ^7.1.0
  # 桌面端专用
  window_manager: ^0.3.8
  system_tray: ^2.0.3
  tray_manager: ^0.2.1
  desktop_drop: ^0.4.4
  # hotkey_manager: 0.1.7  # 暂时移除，与 Flutter 3.24 不兼容
  # Markdown 增强
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # flutter_math_fork: 0.7.4  # 移除，Windows 构建失败，改用文本渲染
  # 导出
  printing: ^5.11.0
  pdf: ^3.10.0
  # 状态管理
  provider: ^6.1.1
  # 工具
  path_provider: ^2.1.0
  # 编码
  gbk_codec: ^0.4.0
  # ZIP 压缩/解压 (DOCX 导入导出)
  archive: ^4.0.7
  # 加密（站点加密服务）
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  # 系统分享
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 精确裁剪 llamadart 打包的原生运行时，大幅缩减 APK 体积
# - llamadart_native_runtimes: 只打 llama_cpp(GGUF)，排除本项目用不到的 litert_lm
# - android-arm64: 仅 Vulkan 后端 + compact CPU profile(单一 armv8.0 baseline)
#   CPU 后端由 llamadart 强制保留，无 Vulkan GPU 设备可自动回退 CPU
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [vulkan]
            cpu_profile: compact

flutter:
  uses-material-design: true
