name: hexo
description: 拓墨 - AI Markdown 写作与静态博客发布工具 - 全平台 (Android / iOS / Web / 桌面)
publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.0.0
  flutter_markdown: ^0.6.12
  file_picker: ^10.0.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  markdown: ^7.1.0
  # 桌面端专用
  window_manager: ^0.3.8
  system_tray: ^2.0.3
  desktop_drop: ^0.4.4
  # hotkey_manager: 0.1.7  # 暂时移除，与 Flutter 3.24 不兼容
  # Markdown 增强（highlight 两包已无代码引用，随 code_highlight 死代码一并移除）
  # 原生 Widget 渲染 Markdown：预览（MarkdownPreviewSmooth）+ 实验性所见即所得编辑器
  flutter_smooth_markdown: ^0.8.1
  # 导出
  printing: ^5.11.0
  pdf: ^3.10.0
  # 状态管理
  provider: ^6.1.1
  # 工具
  path_provider: ^2.1.0
  # Android SAF 存储访问框架
  saf: ^2.1.0
  # 打开外部链接
  url_launcher: ^6.3.2
  # 版本信息
  package_info_plus: ^9.0.1
  # 编码
  gbk_codec: ^0.4.0
  # ZIP 压缩/解压 (DOCX 导入导出)
  archive: ^4.0.7
  # 加密（站点加密服务）
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  # 系统分享
  share_plus: ^10.0.2
  # 阶段2：所见即所得编辑器 spike（Document/Composer + Markdown 双向序列化）
  super_editor: 0.3.0-dev.52

# uuid 4 兼容垫片：super_editor 0.3.0-dev 需 uuid ^4.5，system_tray 钉 uuid ^3；
  # system_tray 仅用 Uuid().v4() 生成标识符，uuid 4 该 API 不变，实测可共存
dependency_overrides:
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
