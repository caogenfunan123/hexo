name: hexo
description: Hexo 博客写作与发布管理系统 - 全平台 (Android / iOS / Web / 桌面)
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  flutter_markdown: ^0.6.12
  webview_flutter: ^4.4.0
  file_picker: ^6.1.1
  crypto: ^3.0.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  markdown: ^7.1.0
  # 桌面端专用
  window_manager: ^0.3.8
  system_tray: ^2.0.3
  tray_manager: ^0.2.1
  bitsdojo_window: ^0.1.6
  desktop_drop: ^0.4.4
  hotkey_manager: ^0.1.7
  # Markdown 增强
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  flutter_math_fork: ^0.7.2
  # 导出
  printing: ^5.11.0
  pdf: ^3.10.0
  # 工具
  path_provider: ^2.1.0

flutter:
  uses-material-design: true