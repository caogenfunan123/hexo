name: hexo
description: 拓墨 - AI Markdown 写作与静态博客发布工具 - 全平台 (Android / iOS / Web / 桌面)
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.0.0
  flutter_markdown: ^0.6.12
  webview_flutter: ^4.4.0
  file_picker: ^10.0.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  markdown: ^7.1.0
  # 桌面端专用
  window_manager: ^0.3.8
  system_tray: ^2.0.3
  tray_manager: ^0.2.1
  desktop_drop: ^0.4.4
  # hotkey_manager: 0.1.7  # 暂时移除，与 Flutter 3.24 不兼容
  # Markdown 增强
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # flutter_math_fork: 0.7.4  # 移除，Windows 构建失败，改用文本渲染
  # 导出
  printing: ^5.11.0
  pdf: ^3.10.0
  # 状态管理
  provider: ^6.1.1
  # 工具
  path_provider: ^2.1.0
  # 打开外部链接
  url_launcher: ^6.3.2
  # 版本信息
  package_info_plus: ^9.0.1
  # 编码
  gbk_codec: ^0.4.0
  # ZIP 压缩/解压 (DOCX 导入导出)
  archive: ^4.0.7
  # 加密（站点加密服务）
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  # 系统分享
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
