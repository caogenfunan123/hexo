plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.hexo"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hexo"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/*.kotlin_module']
            pickFirsts += ['kotlin/annotation/annotation.kotlin_builtins', 'META-INF/*.version']
        }
    }
}
