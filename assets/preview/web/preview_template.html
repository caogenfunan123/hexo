<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/preview/web/katex-inline.min.css">
<link rel="stylesheet" href="/assets/preview/web/highlight-github.css" id="hl-css">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  color: #1f2937;
}
body.theme-dark {
  background: #1e1e1e;
  color: #d4d4d4;
}
#content {
  padding: 16px;
  max-width: 860px;
  margin: 0 auto;
  word-break: break-word;
  font-size: 15px;
  line-height: 1.75;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  margin-top: 1.4em;
  margin-bottom: 0.6em;
  font-weight: 600;
  line-height: 1.35;
}
#content h1 { font-size: 1.7em; border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 0.3em; }
#content h2 { font-size: 1.4em; border-bottom: 1px solid rgba(128,128,128,0.25); padding-bottom: 0.25em; }
#content h3 { font-size: 1.2em; }
#content h4 { font-size: 1.05em; }
#content p { margin: 0.8em 0; }
#content a { color: #2563eb; text-decoration: none; }
#content a:hover { text-decoration: underline; }
body.theme-dark #content a { color: #60a5fa; }
#content img { max-width: 100%; border-radius: 4px; }
#content blockquote {
  margin: 1em 0;
  padding: 0.2em 1em;
  border-left: 4px solid #d1d5db;
  color: #6b7280;
  background: rgba(128,128,128,0.06);
}
body.theme-dark #content blockquote {
  border-left-color: #4b5563;
  color: #9ca3af;
}
#content code {
  font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: rgba(128,128,128,0.15);
  padding: 0.15em 0.35em;
  border-radius: 4px;
}
#content pre {
  background: #f6f8fa;
  border: 1px solid rgba(128,128,128,0.2);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  line-height: 1.5;
}
body.theme-dark #content pre {
  background: #282c34;
}
#content pre code {
  background: transparent;
  padding: 0;
  font-size: 13.5px;
}
#content table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
}
#content th, #content td {
  border: 1px solid rgba(128,128,128,0.35);
  padding: 6px 12px;
}
#content th { background: rgba(128,128,128,0.1); }
#content hr { border: none; border-top: 1px solid rgba(128,128,128,0.3); margin: 1.5em 0; }
#content ul, #content ol { padding-left: 1.6em; margin: 0.8em 0; }
#content .mermaid {
  background: #fafafa;
  border: 1px solid rgba(128,128,128,0.2);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  text-align: center;
  margin: 1em 0;
}
body.theme-dark #content .mermaid {
  background: #24292e;
}
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0;
}
</style>
<script src="/assets/preview/web/katex.min.js"></script>
<script src="/assets/preview/web/auto-render.min.js"></script>
<script src="/assets/preview/web/highlight.min.js"></script>
<script src="/assets/preview/web/languages-dart.min.js"></script>
<script src="/assets/preview/web/mermaid.min.js"></script>
</head>
<body class="theme-light">
<div id="content"></div>
<script>
var _params = new URLSearchParams(location.search);
var _dark = _params.get('dark') === '1';
if (_dark) {
  document.body.className = 'theme-dark';
  var _hlCss = document.getElementById('hl-css');
  if (_hlCss) _hlCss.href = '/assets/preview/web/highlight-github-dark.css';
}

function renderAll() {
  var el = document.getElementById('content');
  if (!el) return;
  // ===== 第一步：先渲染 Mermaid 图表 =====
  // 必须在 KaTeX 之前执行，避免 KaTeX 闯入 mermaid 源码篡改内容
  if (window.mermaid) {
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: _dark ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: 'sans-serif'
      });
      document.querySelectorAll('pre.mermaid').forEach(function (node) {
        var src = (node.textContent || '').trim();
        if (src.indexOf('```') === 0) {
          var firstNewline = src.indexOf('\n');
          src = firstNewline >= 0 ? src.substring(firstNewline + 1) : '';
          if (src.lastIndexOf('```') === src.length - 3) {
            src = src.substring(0, src.length - 3);
          }
        }
        mermaid.render('mmd-' + (node.id || 'g') + '-' + Math.random().toString(36).slice(2, 8), src)
          .then(function (res) {
            var wrap = document.createElement('div');
            wrap.className = 'mermaid svg';
            wrap.innerHTML = res.svg;
            node.parentNode.replaceChild(wrap, node);
          })
          .catch(function (err) {
            var div = document.createElement('div');
            div.className = 'mermaid-error';
            var msg = (err && err.message) ? err.message : String(err);
            div.textContent = '图表渲染失败：' + msg;
            node.parentNode.replaceChild(div, node);
          });
      });
    } catch (e) {}
  }
  // ===== 第二步：再渲染 KaTeX 公式 =====
  // 此时 mermaid 已替换为 SVG，KaTeX 不会再误入代码块
  if (window.renderMathInElement) {
    try {
      renderMathInElement(el, {
        delimiters: [
          {left: '\u0024\u0024', right: '\u0024\u0024', display: true},
          {left: '\u0024', right: '\u0024', display: false}
        ],
        throwOnError: false,
        strict: false,
        ignoredTags: ["pre", "code"]
      });
    } catch (e) {}
  }
  if (window.hljs) {
    try {
      document.querySelectorAll('pre code').forEach(function (block) {
        hljs.highlightElement(block);
      });
    } catch (e) {}
  }
}

function setContent(html) {
  var el = document.getElementById('content');
  if (!el) return;
  el.innerHTML = html;
  renderAll();
}

document.addEventListener('DOMContentLoaded', renderAll);

document.addEventListener('click', function (e) {
  var a = e.target;
  while (a && a.tagName !== 'A') { a = a.parentNode; }
  if (a && a.getAttribute && a.getAttribute('href')) {
    var href = a.getAttribute('href');
    try {
      if (window.flutter_inappwebview &&
          window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('linkHandler', href);
      }
    } catch (e) {}
  }
}, true);
</script>
</body>
</html>
