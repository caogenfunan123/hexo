<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/*__KATEX_CSS__*/
/*__HIGHLIGHT_CSS__*/
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  color: #1f2937;
}
body.theme-dark {
  background: #1e1e1e;
  color: #d4d4d4;
}
#content {
  padding: 16px;
  max-width: 860px;
  margin: 0 auto;
  word-break: break-word;
  font-size: 15px;
  line-height: 1.75;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
  margin-top: 1.4em;
  margin-bottom: 0.6em;
  font-weight: 600;
  line-height: 1.35;
}
#content h1 { font-size: 1.7em; border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 0.3em; }
#content h2 { font-size: 1.4em; border-bottom: 1px solid rgba(128,128,128,0.25); padding-bottom: 0.25em; }
#content h3 { font-size: 1.2em; }
#content h4 { font-size: 1.05em; }
#content p { margin: 0.8em 0; }
#content a { color: #2563eb; text-decoration: none; }
#content a:hover { text-decoration: underline; }
body.theme-dark #content a { color: #60a5fa; }
#content img { max-width: 100%; border-radius: 4px; }
#content blockquote {
  margin: 1em 0;
  padding: 0.2em 1em;
  border-left: 4px solid #d1d5db;
  color: #6b7280;
  background: rgba(128,128,128,0.06);
}
body.theme-dark #content blockquote {
  border-left-color: #4b5563;
  color: #9ca3af;
}
#content code {
  font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: rgba(128,128,128,0.15);
  padding: 0.15em 0.35em;
  border-radius: 4px;
}
#content pre {
  background: #f6f8fa;
  border: 1px solid rgba(128,128,128,0.2);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  line-height: 1.5;
}
body.theme-dark #content pre {
  background: #282c34;
}
#content pre code {
  background: transparent;
  padding: 0;
  font-size: 13.5px;
}
#content table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
}
#content th, #content td {
  border: 1px solid rgba(128,128,128,0.35);
  padding: 6px 12px;
}
#content th { background: rgba(128,128,128,0.1); }
#content hr { border: none; border-top: 1px solid rgba(128,128,128,0.3); margin: 1.5em 0; }
#content ul, #content ol { padding-left: 1.6em; margin: 0.8em 0; }
#content .mermaid {
  background: #fafafa;
  border: 1px solid rgba(128,128,128,0.2);
  border-radius: 6px;
  padding: 12px;
  overflow-x: auto;
  text-align: center;
  margin: 1em 0;
}
body.theme-dark #content .mermaid {
  background: #24292e;
}
.katex-display {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 0;
}
</style>
<script>/*__KATEX_JS__*/</script>
<script>/*__AUTORENDER_JS__*/</script>
<script>/*__HIGHLIGHT_JS__*/</script>
<script>/*__DART_LANG_JS__*/</script>
<script>/*__MERMAID_JS__*/</script>
</head>
<body class="/*__BODY_CLASS__*/">
<div id="content">__CONTENT__</div>
<script>
/*__INIT_JS__*/
</script>
</body>
</html>
