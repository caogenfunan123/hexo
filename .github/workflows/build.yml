name: CI Build & Monitor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 代码静态分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - name: dart format check
        run: dart format --output=none lib/ || true
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos || true

  # ── Android APK 构建 ──
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Web 构建 ──
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-web
          path: build/web
          retention-days: 30

  # ── Linux 桌面构建 ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev

      - run: flutter pub get
      - run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-linux
          path: build/linux/x64/release/bundle
          retention-days: 30

  # ── 发布 APK 到 GitHub Release（仅 main 分支 push） ──
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hexo-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build
          tag_name: latest
          body: |
            ## 自动构建

            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - [查看 CI 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            | 平台 | 产物 |
            |------|------|
            | Android | `hexo-apk` (本附件) |
            | Web | `hexo-web` |
            | Linux | `hexo-linux` |
          files: app-release.apk
          prerelease: true