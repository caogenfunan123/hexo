name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate local.properties
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> local.properties

      - name: Download Gradle Wrapper Jar
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.6.3/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean old release
        run: rm -rf release/

      - name: Build APK
        run: flutter build apk --release || true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find build/app/outputs/flutter-apk/ -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -la "$APK"

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp "${{ steps.find_apk.outputs.apk_path }}" "release/hexo-release.apk"
          ls -la release/
          echo "VERSION_NAME=$(grep versionName android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_ENV
          echo "VERSION_CODE=$(grep versionCode android/app/build.gradle | head -1 | awk '{print $3}')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Commit APK to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release/latest
          git add release/
          git commit -m "build: APK v${VERSION_NAME}+${VERSION_CODE} (${BUILD_TIME})" || echo "No changes to commit"
          git push -f origin release/latest
