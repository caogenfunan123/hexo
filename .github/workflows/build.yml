name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate local.properties
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> local.properties

      - name: Download Gradle Wrapper Jar
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.6.3/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release || true

      - name: Find APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build directories ==="
          ls -la build/ 2>/dev/null || echo "No build/ dir"
          ls -la android/app/build/outputs/ 2>/dev/null || echo "No android/app/build/outputs/ dir"

      - name: Copy APK to expected location
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-release.apk
            echo "Found and copied: $APK"
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hexo-release-apk
          path: build/app/outputs/flutter-apk/*.apk
