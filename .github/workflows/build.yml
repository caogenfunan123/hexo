name: CI Build & Monitor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Node.js 24 强制启用（2026-06-16 后默认，显式设置确保兼容）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 代码静态分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub cache repair
      - run: flutter pub get
      - name: dart format check
        run: dart format --output=none lib/ || true
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos || true

  # ── Android APK 构建 ──
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup Android SDK
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
          flutter config --android-sdk "$ANDROID_HOME"
          flutter doctor --verbose 2>&1 | head -50

      - name: Build APK
        continue-on-error: true
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-android-gradle-daemon 2>&1 | tee /tmp/build.log
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo '## Android Build Succeeded' >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Android build failed. Check logs for details."
            echo "=== Last 100 lines of output ==="
            tail -100 /tmp/build.log
            echo '## Android Build Failed' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/build.log
          retention-days: 3

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

  # ── Web 构建 ──
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate web platform
        run: flutter create --platforms=web . 2>/dev/null || true

      - run: flutter pub get
      - name: Build Web
        run: flutter build web --release 2>&1 | tee /tmp/build-web.log
        continue-on-error: true

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-web
          path: build/web
          if-no-files-found: warn
          retention-days: 30

  # ── Linux 桌面构建 ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev libsqlite3-dev

      - name: Generate linux platform
        run: flutter create --platforms=linux . 2>/dev/null || true

      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release --target=lib/desktop/desktop_main.dart 2>&1 | tee /tmp/build-linux.log
        continue-on-error: true

      - name: Pack Linux release
        run: |
          if [ -d "build/linux/x64/release/bundle" ]; then
            cd build/linux/x64/release/bundle && tar -czf /tmp/hexo-linux.tar.gz . && mv /tmp/hexo-linux.tar.gz "$GITHUB_WORKSPACE/hexo-linux.tar.gz"
            echo "Created hexo-linux.tar.gz ($(wc -c < hexo-linux.tar.gz) bytes)"
          else
            echo "::warning::Bundle directory not found, skipping"
          fi

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: /tmp/build-linux.log
          retention-days: 7

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-linux
          path: hexo-linux.tar.gz
          if-no-files-found: warn
          retention-days: 30

  # ── Windows 桌面构建 ──
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Regenerate windows platform (fix CMake VS version)
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --platforms=windows .
          flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub cache repair
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --target=lib/desktop/desktop_main.dart 2>&1 | Tee-Object -FilePath build-windows.log
        continue-on-error: true

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log
          retention-days: 7

      - name: Pack Windows release
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dest = "hexo-windows.zip"
          if (Test-Path $src) {
            Compress-Archive -Path "$src\*" -DestinationPath $dest -Force
            Write-Host "Created $dest ($((Get-Item $dest).Length) bytes)"
          } else {
            Write-Host "::warning::Release directory not found, skipping"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-windows
          path: hexo-windows.zip
          if-no-files-found: warn
          retention-days: 30

  # ── 发布到 GitHub Release（仅 main 分支 push） ──
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build-android, build-web, build-linux, build-windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: List artifacts
        run: find artifacts -type f | sort || echo "No artifacts found"

      - name: Delete old release (to clean up individual files)
        run: |
          # Delete old release
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted old release (id=$RELEASE_ID)"
          fi
          # Delete old tag
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true
          echo "Cleaned up old tag (if existed)"
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build
          tag_name: latest
          body: |
            ## 自动构建

            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - [查看 CI 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            | 平台 | 产物 |
            |------|------|
            | Android | `hexo-apk` |
            | Web | `hexo-web` |
            | Linux 桌面 | `hexo-linux` |
            | Windows 桌面 | `hexo-windows` |
          files: |
            artifacts/**
          prerelease: true