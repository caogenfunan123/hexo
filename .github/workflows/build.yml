name: CI Build & Monitor

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 使用 Node.js 24（已弃用 Node.js 20）
  NODE_VERSION: 24

jobs:
  # ── 代码静态分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup environment
        run: |
          echo "Flutter version: $(flutter --version)"
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-android

      - run: flutter pub cache repair
      - run: flutter pub get

      # 真门禁：analyze 失败（error/warning）即红；info 不拦（--no-fatal-infos）。
      # dart format 未全库统一（230/262 文件未格式化），不做门禁，避免假检查。
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # 测试门禁：所有 *_test.dart（含批量发布/l10n），失败即红
      - name: Flutter test
        run: flutter test

      - name: Check for critical issues
        run: |
          # 检查是否有明显的语法错误
          if grep -r "import.*nonexistent" lib/; then
            echo "::error::Found nonexistent imports"
            exit 1
          fi

          echo "Code analysis completed successfully"

  # ── Android APK 构建 ──
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: flutter pub get

      - name: Setup Android SDK
        run: |
          echo "Flutter version: $(flutter --version)"
          echo "Android SDK path: $ANDROID_HOME"
          echo "Android SDK root: $ANDROID_SDK_ROOT"
          
          # 设置 Android SDK 路径
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          
          # 验证 Android SDK
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found at $ANDROID_HOME"
            exit 1
          fi
          
          flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || echo "License acceptance failed, continuing..."

      - name: Install Android SDK components
        run: |
          # Android SDK 组件由 AGP 自动安装。
          echo "Android SDK ready"

      - name: Fetch release signing keystore
        if: always()
        run: |
          # 从私有签名仓库拉取固定签名密钥，保证 APK 签名一致可覆盖升级
          git clone --depth 1 https://x-access-token:${{ secrets.KEYSTORE_REPO_TOKEN }}@github.com/caogenfunan123/hexo-android-signing.git /tmp/signing
          cp /tmp/signing/hexo-release.keystore android/app/
          cp /tmp/signing/key.properties android/
          echo "Signing keystore ready"

      - name: Build APKs (all ABIs + universal)
        run: |
          set -o pipefail
          flutter pub get
          
          # 不加 --split-per-abi：splits { abi { universalApk true } } 在 build.gradle
          # 中已配置，一次构建同时产出 arm64-v8a / armeabi-v7a / universal 三个 APK
          flutter build apk --release 2>&1 | tee /tmp/build.log
          
          # 验证构建结果
          OUT=build/app/outputs/flutter-apk
          if [ ! -f "$OUT/app-release.apk" ]; then
            echo "::error::APK build failed - app-release.apk not found"
            ls -la "$OUT" || true
            echo "=== Last 100 lines of output ==="
            tail -100 /tmp/build.log
            exit 1
          fi
          
          echo "APK build completed successfully"
          ls -lh "$OUT"/*.apk
          echo '## Android Build Succeeded' >> $GITHUB_STEP_SUMMARY
          {
            echo '## APK 产物'
            echo '| 文件 | 大小 |'
            echo '|---|---|'
            for f in "$OUT"/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexo-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 30

  # ── Web 构建 ──
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup environment
        run: |
          echo "Flutter version: $(flutter --version)"
          echo "Available platforms: $(flutter devices | grep -E 'Chrome|Web' | head -1 || echo 'Web devices not found')"
          
      - name: Generate web platform
        run: |
          flutter create --platforms=web . 2>/dev/null || true
          flutter devices | grep -E 'Chrome|Web' || echo "Web platform not available"

      - run: flutter pub get
      - name: Clean build
        run: flutter clean
        
      - name: Build Web
        run: |
          # 使用 --base-href 让 Web 版可部署到 GitHub Pages 子路径（/hexo-web/）
          flutter build web --release --base-href /hexo-web/ \
            2>&1 | tee /tmp/build-web.log
          
          # 验证构建结果
          if [ ! -d "build/web" ]; then
            echo "::error::Web build failed - no output directory"
            exit 1
          fi
          
          if [ ! -f "build/web/index.html" ]; then
            echo "::error::Main index.html not found"
            exit 1
          fi
          
          echo "Web build completed successfully"
          echo "Build size: $(du -sh build/web | cut -f1)"

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-web
          path: build/web
          if-no-files-found: warn
          retention-days: 30

  # ── Linux 桌面构建 ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev libsqlite3-dev libayatana-appindicator3-dev libsecret-1-dev libnotify-dev

      - name: Generate linux platform
        run: |
          flutter create --platforms=linux . 2>/dev/null || true
          flutter config --enable-linux-desktop

      - run: flutter clean
      - run: flutter pub get
      - name: Build Linux
        run: |
          flutter build linux --release --target=lib/desktop/desktop_main.dart 2>&1 | tee /tmp/build-linux.log
          
          # 验证构建结果
          if [ ! -d "build/linux/x64/release/bundle" ]; then
            echo "::error::Linux build failed - no bundle directory"
            exit 1
          fi

      - name: Pack Linux release
        run: |
          if [ -d "build/linux/x64/release/bundle" ]; then
            cd build/linux/x64/release/bundle && tar -czf /tmp/hexo-linux.tar.gz . && mv /tmp/hexo-linux.tar.gz "$GITHUB_WORKSPACE/hexo-linux.tar.gz"
            echo "Created hexo-linux.tar.gz ($(wc -c < hexo-linux.tar.gz) bytes)"
          else
            echo "::warning::Bundle directory not found, skipping"
          fi

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: /tmp/build-linux.log
          retention-days: 7

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-linux
          path: hexo-linux.tar.gz
          if-no-files-found: warn
          retention-days: 30

  # ── Windows 桌面构建 ──
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Setup Windows environment
        run: |
          echo "Flutter version: $(flutter --version)"
          flutter config --enable-windows-desktop

      - name: Regenerate windows platform (fix CMake VS version)
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --platforms=windows .
          flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub cache repair
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release --target=lib/desktop/desktop_main.dart 2>&1 | Tee-Object -FilePath build-windows.log
          
          # 验证构建结果
          if (-not (Test-Path "build/windows/x64/runner/Release")) {
            Write-Host "::error::Windows build failed - no release directory"
            exit 1
          }
          
          Write-Host "Windows build completed successfully"

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log
          retention-days: 7

      - name: Pack Windows release
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dest = "hexo-windows.zip"
          if (Test-Path $src) {
            Compress-Archive -Path "$src\*" -DestinationPath $dest -Force
            Write-Host "Created $dest ($((Get-Item $dest).Length) bytes)"
          } else {
            Write-Host "::warning::Release directory not found, skipping"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hexo-windows
          path: hexo-windows.zip
          if-no-files-found: warn
          retention-days: 30

  # ── 发布到 GitHub Release（仅 tag vX.Y.Z push 触发） ──
  # 普通代码 push 不产生 release，避免 Releases 页面被构建噪音刷屏。
  # 发版流程见 docs/RELEASE_PROCESS.md；tag 由 tools/release.sh 创建。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, build-android, build-web, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Available Artifacts ==="
          find artifacts -type f | sort || echo "No artifacts found"
          echo "=== Artifact Count ==="
          find artifacts -type f | wc -l || echo "0 artifacts found"

      - name: Verify artifacts
        run: |
          # 关键产物缺失即失败（此前仅 warning + continue-on-error，
          # 曾可能发出空 Release）
          set -euo pipefail
          for f in app-release.apk hexo-linux.tar.gz hexo-windows.zip; do
            if [ ! -f "artifacts/$f" ]; then
              echo "::error::Required artifact not found: $f"
              exit 1
            fi
          done
          if [ ! -d "artifacts/assets" ]; then
            echo "::error::Web build (assets) not found"
            exit 1
          fi
          echo "All required artifacts present"

      - name: Compute SHA256 for assets
        run: |
          set -euo pipefail
          cd artifacts
          for f in $(find . -type f); do
            echo "$(sha256sum "$f" | awk '{print $1}')  $f"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.ref_name }}"
          tag_name: "${{ github.ref_name }}"
          fail_on_unmatched_files: false
          overwrite: true
          body: |
            ## 版本 ${{ github.ref_name }}

            > 发布流程见 `docs/RELEASE_PROCESS.md`；客户端通过仓库根目录 `release.json` 获取更新信息。

            | 平台 | 产物 | 下载 |
            |------|------|------|
            | Android universal | `app-release.apk` | https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk |
            | Android arm64 | `app-arm64-v8a-release.apk` | https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-arm64-v8a-release.apk |
            | Android armv7 | `app-armeabi-v7a-release.apk` | https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-armeabi-v7a-release.apk |
            | Linux | `hexo-linux.tar.gz` | https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hexo-linux.tar.gz |
            | Windows | `hexo-windows.zip` | https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hexo-windows.zip |

            ### 更新日志
            详见仓库根目录 `release.json` 的 `notes` 字段，或本次提交历史。

            ### 构建信息
            - Flutter 版本: 3.44.9
            - 构建时间: ${{ github.run_started_at }}
            - 提交: `${{ github.sha }}`
          files: |
            artifacts/app-release.apk
            artifacts/app-arm64-v8a-release.apk
            artifacts/app-armeabi-v7a-release.apk
            artifacts/hexo-linux.tar.gz
            artifacts/hexo-windows.zip
          prerelease: false
          draft: false