name: CI Build & Monitor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 代码静态分析 ──
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - name: dart format check
        run: dart format --output=none lib/ || true
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos || true

  # ── Android APK 构建 ──
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup Android SDK
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # 确保 local.properties 存在且正确
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
          flutter config --android-sdk "$ANDROID_HOME"
          flutter doctor --verbose 2>&1 | head -50

      - name: Build APK
        id: build
        run: |
          flutter build apk --release --no-pub --no-android-gradle-daemon 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed. Check logs for details."
            echo "=== Last 100 lines of output ==="
            tail -100 /tmp/build.log
            exit $BUILD_EXIT
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/build.log
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── Web 构建 ──
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate web platform
        run: flutter create --platforms=web . 2>/dev/null || true

      - run: flutter pub get
      - run: flutter build web --release 2>&1 | tee /tmp/build-web.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-web
          path: build/web
          retention-days: 30

  # ── Linux 桌面构建 ──
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev libsqlite3-dev

      - name: Generate linux platform
        run: flutter create --platforms=linux . 2>/dev/null || true

      - run: flutter pub get
      - run: flutter build linux --release 2>&1 | tee /tmp/build-linux.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: hexo-linux
          path: build/linux/x64/release/bundle
          retention-days: 30

  # ── 发布 APK 到 GitHub Release（仅 main 分支 push） ──
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hexo-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build
          tag_name: latest
          body: |
            ## 自动构建

            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - [查看 CI 详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            | 平台 | 产物 |
            |------|------|
            | Android | `hexo-apk` (本附件) |
            | Web | `hexo-web` |
            | Linux | `hexo-linux` |
          files: app-release.apk
          prerelease: true